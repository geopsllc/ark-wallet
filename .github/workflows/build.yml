# Builds ARK Wallet for macOS, Windows and Linux, each for Intel/AMD (x64) and ARM (arm64).
#
# - Every push to main (and every pull request) builds all six and keeps the installers as
#   workflow artifacts. Nothing is published.
# - Pushing a version tag (v1.2.3) does the same and then publishes a GitHub release with the
#   installers and a SHA256SUMS file.
#
# No personal certificates are used: macOS builds are ad-hoc signed ("-" in tauri.conf.json),
# Windows and Linux builds are unsigned.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - name: macos-x64
            os: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: msi,nsis
          - name: windows-arm64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            bundles: nsis # MSI (WiX) does not support ARM64
          - name: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
          - name: linux-arm64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: deb,rpm,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf file

      - run: npm ci

      - name: Tests (signing and serialization)
        if: matrix.name == 'linux-x64' || matrix.name == 'macos-arm64'
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build
        run: npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Collect installers
        shell: bash
        run: |
          set -euo pipefail
          v=$(node -p 'require("./src-tauri/tauri.conf.json").version')
          b="src-tauri/target/${{ matrix.target }}/release/bundle"
          mkdir -p out
          shopt -s nullglob
          for f in "$b"/dmg/*.dmg;            do cp "$f" "out/ARK-Wallet_${v}_${{ matrix.name }}.dmg"; done
          for f in "$b"/msi/*.msi;            do cp "$f" "out/ARK-Wallet_${v}_${{ matrix.name }}.msi"; done
          for f in "$b"/nsis/*.exe;           do cp "$f" "out/ARK-Wallet_${v}_${{ matrix.name }}-setup.exe"; done
          for f in "$b"/deb/*.deb;            do cp "$f" "out/ARK-Wallet_${v}_${{ matrix.name }}.deb"; done
          for f in "$b"/rpm/*.rpm;            do cp "$f" "out/ARK-Wallet_${v}_${{ matrix.name }}.rpm"; done
          for f in "$b"/appimage/*.AppImage;  do cp "$f" "out/ARK-Wallet_${v}_${{ matrix.name }}.AppImage"; done
          ls -la out
          [ -n "$(ls out)" ] || { echo "no installers were produced"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Checksums
        run: cd out && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          draft: false
          make_latest: true
          name: ARK Wallet ${{ github.ref_name }}
          files: out/*
          body: |
            Builds for macOS, Windows and Linux (x64 and arm64), made by GitHub Actions from this tag.
            Verify downloads against SHA256SUMS. macOS builds are ad-hoc signed and Windows/Linux builds
            are unsigned, so your OS will warn on first launch (see the README).
