[package]
name = "ark-wallet"
version = "0.1.0"
description = "ARK Wallet - cross-platform desktop wallet for the ARK blockchain"
edition = "2021"
license = "MIT"
repository = "https://github.com/geopsllc/ark-wallet"

[lib]
name = "ark_wallet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
k256 = { version = "0.13", features = ["ecdsa", "arithmetic", "expose-field"] }
sha2 = "0.10"
ripemd = "0.1"
bs58 = { version = "0.5", features = ["check"] }
bip39 = { version = "2", features = ["rand"] }
hex = "0.4"
zeroize = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
