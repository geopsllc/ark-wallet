[package]
name = "ark-wallet"
version = "0.4.4"
description = "ARK Wallet - cross-platform desktop wallet for the ARK blockchain"
edition = "2021"
license = "MIT"
repository = "https://github.com/geopsllc/ark-wallet"

[lib]
name = "ark_wallet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
k256 = { version = "0.13", features = ["ecdsa", "arithmetic", "expose-field"] }
sha2 = "0.10"
sha3 = "0.10"
ripemd = "0.1"
bs58 = { version = "0.5", features = ["check"] }
bip39 = { version = "2", features = ["rand"] }
# Mainsail validator keys (BLS12-381, EIP-2333); "portable" keeps release builds runnable on older x86 CPUs
blst = { version = "0.3", features = ["portable"] }
hex = "0.4"
zeroize = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# macOS: catch the trackpad "swipe between pages" gesture (three-finger swipe), which the
# webview never sees, and forward it to the UI as a Back action.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSEvent", "NSResponder", "block2"] }
block2 = "0.6"
